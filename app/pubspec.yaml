name: souldreams
description: "SoulDreams app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  record: 7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The curated set of night paintings and New Dream's sky (D147), bundled:
  # never fetched at run time (R10). Each file is fingerprinted there (G2);
  # the folder's fingerprints.txt is bundled with them.
  assets:
    - assets/paintings/

  # The faces the Design System names (D49 a), bundled: never fetched at
  # run time (R10). Each file is fingerprinted in assets/fonts/.
  fonts:
    - family: Tangerine
      fonts:
        - asset: assets/fonts/Tangerine-Regular.ttf
    - family: SortsMillGoudy
      fonts:
        - asset: assets/fonts/SortsMillGoudy-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
    - family: Habibi
      fonts:
        - asset: assets/fonts/Habibi-Regular.ttf
    - family: Bellefair
      fonts:
        - asset: assets/fonts/Bellefair-Regular.ttf
